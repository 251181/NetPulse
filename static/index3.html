<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NetPulse</title>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: monospace;
        background: #111;
        color: #eee;
        display: flex;
        height: 100vh;
        font-size: 13px;
    }
    
    .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 42px;
        background: #161616;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        padding: 0 12px;
        z-index: 1000;
    }

    .logo {
        font-size: 12px;
        letter-spacing: 1px;
        color: #0cf;
        font-weight: bold;
    }
    
    .logo-img {
        height: 22px;
        width: auto;
        display: block;
    }

    .sidebar {
        width: 210px;
        background: #161616;
        border-right: 1px solid #2a2a2a;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        flex-shrink: 0;
        margin-top: 42px;
        height: calc(100vh - 42px);
    }

    .sidebar-section { padding: 12px 10px 6px; }

    .section-title {
        color: #555;
        font-size: 10px;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }

    .device-card {
        padding: 10px;
        margin-bottom: 4px;
        background: #1c1c1c;
        border-left: 3px solid #2a2a2a;
        cursor: pointer;
    }

    .device-card:hover { background: #222; }

    .device-card.active {
        border-left-color: #0cf !important;
        background: #1a2a2a;
    }
    
    .device-card.archived {
        opacity: 0.5;
    }

    .device-name { font-size: 12px; margin-bottom: 4px; }

    .device-meta { display: flex; align-items: center; gap: 8px; }
    .device-ip { color: #555; font-size: 10px; }

    .badge {
        display: inline-block;
        padding: 2px 7px;
        font-size: 10px;
        border-radius: 2px;
        font-family: monospace;
    }

    .badge-online  { background: #0a2a1a; color: #0f6; border: 1px solid #0a4a2a; }
    .badge-offline { background: #2a0a0a; color: #f55; border: 1px solid #4a1a1a; }
    .badge-warn    { background: #2a2000; color: #fa0; border: 1px solid #4a3800; }

    .main { 
        flex: 1; 
        overflow-y: auto; 
        background: #111; 
        margin-top: 42px;
        height: calc(100vh - 42px);
    }

    .main-header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid #1e1e1e;
        display: flex;
        align-items: baseline;
        gap: 10px;
    }

    .main-header h2 { font-size: 15px; font-family: monospace; }
    .header-ip { color: #555; font-size: 11px; }

    .section {
        padding: 12px 16px;
        border-bottom: 1px solid #1a1a1a;
    }

    .section-label {
        color: #555;
        font-size: 10px;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .info-item .k {
        color: #666;
        font-size: 10px;
        margin-bottom: 2px;
    }

    .info-item .v { font-size: 12px; }

    .perf-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
    }

    .perf-label {
        color: #888;
        font-size: 10px;
        width: 120px;
        flex-shrink: 0;
    }

    .perf-bar-track {
        flex: 1;
        height: 8px;
        background: #222;
        border-radius: 1px;
        overflow: hidden;
    }

    .perf-bar-fill { height: 100%; border-radius: 1px; }

    .cpu-fill-ok   { background: #0a4a2a; }
    .cpu-fill-warn { background: #5a3a00; }
    .cpu-fill-high { background: #4a0a0a; }

    .perf-val {
        font-size: 11px;
        flex: 1;
        text-align: left;
    }

    table.iface {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        table-layout: fixed;
    }

    table.iface th {
        color: #555;
        font-weight: normal;
        text-align: left;
        padding: 5px 8px;
        font-size: 10px;
        letter-spacing: 1px;
    }

    table.iface td {
        padding: 5px 8px 5px 0;
        border-top: 1px solid #1e1e1e;
        vertical-align: middle;
    }

    .status-up   { color: #0f6; }
    .status-down { color: #f55; }

    #alerts {
        width: 210px;
        background: #111;
        border-left: 1px solid #2a2a2a;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow: hidden;
        margin-top: 42px;
        height: calc(100vh - 42px);
    }

    .alerts-header {
        padding: 12px 10px 8px;
        color: #555;
        font-size: 10px;
        letter-spacing: 2px;
        border-bottom: 1px solid #1e1e1e;
        flex-shrink: 0;
    }

    #alerts-list {
        overflow-y: auto;
        flex: 1;
        padding: 8px;
    }

    .alert {
        padding: 7px 8px;
        margin-bottom: 5px;
        font-size: 10px;
        border-left: 2px solid;
        line-height: 1.5;
        cursor: pointer;
    }

    .alert-critical { border-left-color: #f55; background: #1a0a0a; }
    .alert-high     { border-left-color: #ff7043; background: #1f1208; }
    .alert-warning  { border-left-color: #fa0; background: #1a1500; }
    .alert-info     { border-left-color: #0cf; background: #0a1a1a; }

    .alert-time   { color: #555; margin-bottom: 2px; }
    .alert-type   { font-size: 9px; letter-spacing: 1px; margin-bottom: 2px; }
    .alert-source { color: #555; font-size: 9px; margin-bottom: 2px; }
</style>
</head>

<body>
    
<div class="topbar">
    <img src="static/assets/NetPulse.png" class="logo-img" alt="NetPulse">
</div>

<div class="sidebar">
    <div class="sidebar-section">
        <div class="section-title">DEVICES</div>
        <div id="device-list"></div>
    </div>
</div>

<div class="main">
    <div id="main-header" class="main-header" style="display:none">
        <h2 id="title-name"></h2>
        <span class="header-ip" id="title-ip"></span>
        <span id="title-badge"></span>
    </div>

    <div id="device-details"></div>
</div>

<div id="alerts">
    <div class="alerts-header">ALERTY</div>
    <div id="alerts-list"></div>
</div>

<script>
const API_BASE = "http://172.16.253.1:8000";

let devices = [];
let selectedDevice = null;
let rawVisible = false;

/* ---------------- HELPERS ---------------- */

function formatBytes(bytes) {
    const n = parseInt(bytes);
    if (!n || n === 0) return "—";
    if (n >= 1073741824) return (n / 1073741824).toFixed(1) + " GB";
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
    if (n >= 1024) return Math.round(n / 1024) + " KB";
    return n + " B";
}

function cpuBarClass(val) {
    const n = parseFloat(val);
    if (n >= 90) return { bar: "cpu-fill-high" };
    if (n >= 75) return { bar: "cpu-fill-warn" };
    return { bar: "cpu-fill-ok" };
}

function statusBadge(status) {
    if (!status) return "";
    const s = status.toLowerCase();
    if (s === "up") return `<span class="badge badge-online">${status}</span>`;
    if (s === "down") return `<span class="badge badge-offline">${status}</span>`;
    return `<span class="badge badge-warn">${status}</span>`;
}

/* ---------------- RENDER ---------------- */

function renderDevices() {
    const el = document.getElementById("device-list");

    const active = devices.filter(d => d.detected === true || d.detected === "true");
    const archived = devices.filter(d => !active.includes(d));

    let html = "";

    if (active.length > 0) {
        html += active.map(d => renderDeviceCard(d)).join("");
    }

    if (archived.length > 0) {
        html += `
            <div class="section-title" style="margin-top:10px;">ARCHIVED</div>
        `;
        html += archived.map(d => renderDeviceCard(d)).join("");
    }

    el.innerHTML = html;
}

function renderDeviceCard(d) {
    const info = d.general || {};
    const name = info.name || d.ip;
    const status = info.status || "unknown";

    const isArchived = d.detected === false;

    return `
        <div class="device-card 
                    ${selectedDevice?.ip === d.ip ? 'active' : ''} 
                    ${isArchived ? 'archived' : ''}"
             onclick="selectDevice('${d.ip}')">
            <div class="device-name">${name}</div>
            <div class="device-meta">
                ${statusBadge(status)}
                <span class="device-ip">${d.ip}</span>
            </div>
        </div>
    `;
}
    
function renderDevice() {
    const el = document.getElementById("device-details");
    const header = document.getElementById("main-header");

    if (!selectedDevice) {
        el.innerHTML = `<div style="padding:20px;color:#555;">Wybierz urządzenie</div>`;
        header.style.display = "none";
        return;
    }

    const d = selectedDevice;
    const info = d.general || {};
    const perf = d.performance?.normalized || {};
    const isDown = (info.status || "").toLowerCase() === "down";
    const interfaces = d.interfaces || [];

    header.style.display = "flex";
    document.getElementById("title-name").textContent = info.name || d.ip;
    document.getElementById("title-ip").textContent = d.ip;
    document.getElementById("title-badge").innerHTML = statusBadge(info.status);

    let html = "";

    html += `
        <div class="section">
            <div class="section-label">GENERAL</div>
            <div class="info-grid">
                <div class="info-item"><div class="k">IP</div><div class="v">${d.ip}</div></div>
                <div class="info-item"><div class="k">STATUS</div><div class="v">${statusBadge(info.status)}</div></div>
                <div class="info-item"><div class="k">VENDOR</div><div class="v">${info.vendor || "—"}</div></div>
                <div class="info-item"><div class="k">TYPE</div><div class="v">${info.type || "—"}</div></div>
                <div class="info-item"><div class="k">INTERFACES</div><div class="v">${interfaces.length}</div></div>
                <div class="info-item"><div class="k">NAME</div><div class="v">${info.name || "—"}</div></div>
            </div>
        </div>
    `;

    if (!isDown) {
        html += `
            <div class="section">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="section-label" style="margin:0;">PERFORMANCE</div>

                    <button id="toggle-raw"
                        style="font-size:10px; background:#222; color:#aaa; border:1px solid #333; padding:3px 6px; cursor:pointer;">
                        RAW
                    </button>
                </div>
        `;

        if (perf.cpu_percent !== undefined) {
            const cls = cpuBarClass(perf.cpu_percent);
            html += `
                <div class="perf-row">
                    <span class="perf-label">CPU</span>
                    <div class="perf-bar-track">
                        <div class="perf-bar-fill ${cls.bar}" style="width:${perf.cpu_percent}%"></div>
                    </div>
                    <span class="perf-val">${perf.cpu_percent}%</span>
                </div>
            `;
        }

        if (perf.memory_used_bytes !== undefined) {
            html += `
                <div class="perf-row">
                    <span class="perf-label">Memory</span>
                    <span class="perf-val">${formatBytes(perf.memory_used_bytes)}</span>
                </div>
            `;
        }

        if (rawVisible && d.performance?.raw) {
            html += renderRaw(d.performance.raw);
        }

        html += `</div>`;
    }

    if (interfaces.length > 0) {
        html += `
            <div class="section">
                <div class="section-label">INTERFACES</div>
                <table class="iface">
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>STATUS</th>
                            <th>RX</th>
                            <th>TX</th>
                            <th>ERRORS</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${interfaces.map(i => `
                            <tr>
                                <td>${i.name}</td>
                                <td class="${i.status === "up" ? "status-up" : "status-down"}">${i.status}</td>
                                <td>${formatBytes(i.rx_bytes)}</td>
                                <td>${formatBytes(i.tx_bytes)}</td>
                                <td>${i.rx_errors} / ${i.tx_errors}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>
        `;
    }

    el.innerHTML = html;
}

function renderRaw(raw) {
    if (!raw) return "";

    let html = `
        <div style="margin-top:10px; border-top:1px solid #1e1e1e; padding-top:8px;">
            <div class="section-label">RAW</div>
    `;

    for (const key in raw) {
        html += `
            <div class="perf-row">
                <span class="perf-label">${key}</span>
                <span class="perf-val">${raw[key] ?? "—"}</span>
            </div>
        `;
    }

    html += `</div>`;
    return html;
}

/* ---------------- ACTIONS ---------------- */

function selectDevice(ip) {
    rawVisible = false;
    selectedDevice = devices.find(d => d.ip === ip) || null;
    renderDevices();
    renderDevice();
}

/* ---------------- NETWORK ---------------- */

async function init() {
    try {
        const response = await fetch(`${API_BASE}/devices`);
        devices = await response.json();

        devices.sort((a, b) => (a.ip || "").localeCompare(b.ip || ""));

        renderDevices();
        connectSSE();
    } catch (err) {
        console.error("Init error:", err);
    }
}

function connectSSE() {
    const es = new EventSource(`${API_BASE}/events`);

    es.onmessage = (e) => {
        try {
            const event = JSON.parse(e.data);
            addAlert(event);
        } catch {}
    };
}

/* ---------------- ALERTS ---------------- */

function addAlert(event) {
    const el = document.getElementById("alerts-list");
    const div = document.createElement("div");

    const level = event.threatLevel || "info";
    div.className = "alert alert-" + level;

    div.innerHTML = `
        <div class="alert-time">${event.timestamp || new Date().toISOString()}</div>
        <div class="alert-type">${event.type || "UNKNOWN"}</div>
        <div class="alert-source">${event.ip || "system"}</div>
        <div>${event.message || ""}</div>
    `;

    div.onclick = () => {
        if (!event.ip) return;

        const device = devices.find(d => d.ip === event.ip);
        if (!device) return;

        selectedDevice = device;
        renderDevices();
        renderDevice();
    };

    el.prepend(div);
}

/* ---------------- EVENTS ---------------- */

document.addEventListener("click", (e) => {
    if (e.target && e.target.id === "toggle-raw") {
        rawVisible = !rawVisible;
        renderDevice();
    }
});

/* ---------------- BOOT ---------------- */

init();
</script>
</body>
</html>
